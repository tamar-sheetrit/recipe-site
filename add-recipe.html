<!DOCTYPE html>
<html lang="en" dir="rtl" lang="he">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="add-recipe.css">
    <meta name="viewport" content="width=device-width, initial-scale=1">
</head>

<body>
    <form action="#" method="get">
        <h1>הוספת מתכון</h1>
        <div class="field">
            <label for="title">שם המתכון</label>
            <input type="text" id="title" name="title" placeholder="למשל: עוגת תפוחים" required>
        </div>
        <fieldset>
            <legend> סוג המנה</legend>
            <div class="options">
                <span class="option">
                    <input type="radio" id="meat" name="kind" value="meat">
                    <label for="meat">בשרי </label>
                </span>
                <span class="option">
                    <input type="radio" id="dairy" name="kind" value="meat">
                    <label for="dairy">חלבי</label>
                </span>
                <span class="option">
                    <input type="radio" id="parve" name="kind" value="meat">
                    <label for="parve"> פרווה</label>
                </span>
            </div>
        </fieldset>
        <div class="row">

            <div class="field">
                <label for="category"> קטגוריה</label>
                <select>
                    <option value="100">מרקים</option>
                    <option value="101">עיקריות</option>
                    <option value="102">סלטים</option>
                    <option value="103">מאפים</option>
                    <option value="104">קינוחים</option>
                </select>
            </div>

            <div class="field">
                <label for="time"> זמן הכנה </label>
                <input type="time" id="time" name="time" value="00:10" max="05:00" required>
            </div>

            <div class="field">
                <label for="servings"> מספר מנות </label>
                <input type="number" id="servings" name="servings" min="1" max="50" value="4">
            </div>

            <div class="field">
                <label for="ingredients"> מצרכים</label>
                <textarea id="ingredients" name="ingredients" rows="5" , required>
            </textarea>
            </div>
            <div class="field">
                <label for="ingredients"> אופן ההכנה</label>
                <textarea id="ingredients" name="ingredients" rows="5" , required>
            </textarea>
            </div>
            <fieldset>
                <legend> מתאים ל...</legend>
                <div class="options">
                    <span class="option">
                        <input type="radio" id="holydays" name="suitable" value="meat">
                        <label for="holydays">חגים</label>
                    </span>
                    <span class="option">
                        <input type="radio" id="kids" name="suitable" value="meat">
                        <label for="kids">ילדים</label>
                    </span>
                    <span class="option">
                        <input type="radio" id="quick" name="suitable" value="meat">
                        <label for="quick">הכנה מהירה</label>
                    </span>
                </div>
            </fieldset>



            <div class="field">
                <label for="img"> מספר מנות </label>
                <input type="file" id="img" name="img" accept="image/*">
            </div>
        </div>
        <button>
            שמירת המתכון
        </button>

    </form>

</body>

</html>
